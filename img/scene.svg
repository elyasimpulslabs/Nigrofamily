<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" preserveAspectRatio="xMidYMid slice">
  <style>
    .sun{animation:rise 3.2s cubic-bezier(.2,.7,.2,1) both}
    .glow{animation:breathe 7s ease-in-out infinite alternate}
    .waves{animation:drift 9s ease-in-out infinite alternate}
    .branch{transform-origin:0 -82px;animation:sway 6s ease-in-out infinite alternate}
    @keyframes rise{from{transform:translateY(90px);opacity:.2}to{transform:none;opacity:1}}
    @keyframes breathe{from{opacity:.55}to{opacity:1}}
    @keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
    @keyframes sway{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0F0F0"/><stop offset=".55" stop-color="#E9CFCF"/><stop offset="1" stop-color="#BEB3A8"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#787168"/><stop offset="1" stop-color="#7D7575"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1A1A1A"/><stop offset=".5" stop-color="#333333"/><stop offset="1" stop-color="#1A1A1A"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#E9CFCF" stop-opacity=".9"/><stop offset="1" stop-color="#E9CFCF" stop-opacity="0"/>
    </radialGradient>
    <mask id="arches">
      <rect width="600" height="720" fill="#fff"/>
      <path d="M40 720V300a110 110 0 0 1 220 0v420z" fill="#000"/>
      <path d="M340 720V300a110 110 0 0 1 220 0v420z" fill="#000"/>
    </mask>
  </defs>
  <rect width="600" height="720" fill="url(#sky)"/>
  <circle class="glow" cx="300" cy="400" r="210" fill="url(#glow)"/>
  <circle class="sun" cx="300" cy="420" r="62" fill="#787168"/>
  <path d="M0 430 C80 380 150 395 210 410 C260 380 330 360 420 400 C480 385 550 395 600 410 V460 H0Z" fill="#787168" opacity=".55"/>
  <path d="M0 455 C120 430 220 450 300 440 C400 430 500 448 600 440 V470 H0Z" fill="#787168" opacity=".7"/>
  <rect y="462" width="600" height="258" fill="url(#sea)"/>
  <g class="waves" stroke="#BEB3A8" stroke-width="2" stroke-linecap="round" opacity=".35" fill="none">
    <path d="M60 500h60M200 520h90M380 505h70M90 560h110M330 575h80M470 545h60M150 620h70M400 640h100"/>
  </g>
  <rect y="462" width="600" height="3" fill="#BEB3A8" opacity=".5"/>
  <!-- cypress & houses on the cliff -->
  <path d="M470 470 L470 410 h60 v60z" fill="#BEB3A8"/><path d="M466 412 h68 l-6 -12 h-56z" fill="#B2AA9F"/>
  <path d="M520 470 V430 h50 v40z" fill="#F0F0F0"/><path d="M516 432 h58 l-5 -10 h-48z" fill="#B2AA9F"/>
  <path d="M455 470 c-6 -40 -2 -80 6 -110 c8 30 12 70 6 110z" fill="#333333"/>
  <!-- colonnade -->
  <rect width="600" height="720" fill="url(#wall)" mask="url(#arches)"/>
  <g fill="#7D7575" opacity=".55">
    <rect x="270" y="320" width="60" height="400"/><rect x="0" y="320" width="30" height="400"/><rect x="570" y="320" width="30" height="400"/>
  </g>
  <rect x="0" y="690" width="600" height="30" fill="#1A1A1A"/>
  <!-- terracotta pot with olive branch -->
  <g transform="translate(300 690)">
    <path d="M-34 0 L-42 -70 h84 L34 0z" fill="#B2AA9F"/><rect x="-48" y="-82" width="96" height="14" rx="3" fill="#BEB3A8"/>
    <g class="branch" stroke="#787168" stroke-width="3" fill="none">
      <path d="M0 -82 C-5 -140 -30 -180 -60 -210"/><path d="M0 -82 C10 -150 35 -185 70 -205"/>
    </g>
    <g fill="#B2AA9F">
      <ellipse cx="-22" cy="-140" rx="16" ry="5" transform="rotate(-50 -22 -140)"/><ellipse cx="-40" cy="-178" rx="16" ry="5" transform="rotate(30 -40 -178)"/>
      <ellipse cx="-56" cy="-200" rx="14" ry="4.5" transform="rotate(-30 -56 -200)"/><ellipse cx="22" cy="-150" rx="16" ry="5" transform="rotate(50 22 -150)"/>
      <ellipse cx="44" cy="-180" rx="16" ry="5" transform="rotate(-25 44 -180)"/><ellipse cx="64" cy="-200" rx="14" ry="4.5" transform="rotate(20 64 -200)"/>
      <ellipse cx="-8" cy="-112" rx="13" ry="4" transform="rotate(60 -8 -112)"/>
    </g>
    <circle cx="-30" cy="-160" r="4" fill="#1A1A1A"/><circle cx="34" cy="-168" r="4" fill="#1A1A1A"/>
  </g>
</svg>
